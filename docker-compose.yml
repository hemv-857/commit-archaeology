services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Postgres-backed story cache + BullMQ queue
      DATABASE_URL: postgres://archaeo:archaeo@postgres:5432/commit_archaeology
      REDIS_URL: redis://redis:6379
      # Provide your own token(s); anonymous GitHub calls are rate limited hard.
      GITHUB_TOKENS: ${GITHUB_TOKENS:-}
      # Optional AI narration of feature eras
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      # The web container runs scan jobs inline; set DISABLE_INLINE_WORKER=1
      # and scale the `worker` service instead.
      DISABLE_INLINE_WORKER: ${DISABLE_INLINE_WORKER:-0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    profiles: ["scale"]
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://archaeo:archaeo@postgres:5432/commit_archaeology
      REDIS_URL: redis://redis:6379
      GITHUB_TOKENS: ${GITHUB_TOKENS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: archaeo
      POSTGRES_PASSWORD: archaeo
      POSTGRES_DB: commit_archaeology
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archaeo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
