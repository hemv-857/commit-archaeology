# Fly.io deployment (see README → Self-hosting).
# Fly app names are globally unique across all of Fly, so this must carry the
# owner prefix — a bare "commit-archaeology" will collide with someone else.
app = "commit-archaeology-hemv857"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  # fly secrets set GITHUB_TOKENS=... SENTRY_DSN=... DATABASE_URL=... REDIS_URL=...

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
